<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF0DE">
<title>COFFEE · منو</title>
<meta name="description" content="منوی کافه — بار گرم، بار سرد، بدون قهوه، کیک و کوکی">
<link rel="icon" href="assets/img/cup-dino.png">
<link rel="preload" href="assets/fonts/lalezar.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-art" aria-label="COFFEE">
    <img class="logo" src="assets/img/logo.png" alt="COFFEE">
    <button class="cup" type="button" aria-label="دایناسور توی فنجان">
      <img src="assets/img/cup-dino.png" alt="">
    </button>
  </div>
</header>

<nav class="chips" id="chips" aria-label="دسته‌ها"></nav>

<main class="menu" id="menu"></main>

<div class="addon-wrap" id="addon"></div>

<section class="parade" aria-label="دایناسورها">
  <button class="dino d1" type="button" aria-label="دایناسور"><img src="assets/img/dino1.png" alt=""><span class="shadow"></span></button>
  <button class="dino d2" type="button" aria-label="دایناسور"><img src="assets/img/dino2.png" alt=""><span class="shadow"></span></button>
  <button class="dino d3" type="button" aria-label="دایناسور"><img src="assets/img/dino3.png" alt=""><span class="shadow"></span></button>
  <button class="dino d4" type="button" aria-label="دایناسور باریستا">
    <img src="assets/img/dino4.png" alt="">
    <span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span>
    <span class="shadow"></span>
  </button>
</section>

<div class="ground">
  <div class="walker" aria-hidden="true"><img src="assets/img/dino2.png" alt=""></div>
  <div class="checker"></div>
</div>

<script src="assets/menu-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
